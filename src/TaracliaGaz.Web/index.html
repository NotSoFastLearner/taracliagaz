<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e40af" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />



    <title>Тараклия-ГАЗ — поставка природного газа в Тараклийском районе</title>
    <meta name="description" content="SRL «Taraclia Gaz» — поставка природного газа в Тараклийском районе Молдовы. Тарифы, услуги, новости, тендеры, контакты. Аварийная служба 24/7: 904" />

    <!-- Критический CSS для мгновенной первой отрисовки (app-shell).
         React при монтировании заменяет каркас настоящим приложением. -->
    <style>
        body{margin:0;padding:0;width:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;line-height:1.5;color:#222;background:#f8f9fa}
        .shell-header{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);position:sticky;top:0;z-index:1000}
        .shell-header-inner{display:flex;align-items:center;gap:1.5rem;padding:.75rem 1rem;max-width:1400px;margin:0 auto}
        .shell-logo{display:flex;flex-direction:column;color:#1a50b2}
        .shell-logo-main{font-size:1.5rem;font-weight:700;line-height:1.2}
        .shell-logo-sub{font-size:.85rem;color:#666;font-weight:400}
        .shell-emergency{display:flex;flex-direction:column;align-items:center;background:#d32f2f;color:#fff;padding:.5rem 1rem;border-radius:6px;text-decoration:none;margin-left:auto}
        .shell-emergency-label{font-size:.75rem;opacity:.9}
        .shell-emergency-number{font-size:1.5rem;font-weight:700;line-height:1}
        .shell-hero{background:linear-gradient(135deg,#004494 0%,#0057b8 50%,#0066d4 100%);color:#fff;padding-block:4rem;text-align:center}
        .shell-container{width:min(1200px,calc(100% - 2rem));margin-inline:auto}
        .shell-hero h1{color:#fff;font-size:3rem;margin:0 0 1rem;font-weight:800;letter-spacing:.5px}
        .shell-hero-sub{font-size:1.25rem;opacity:.95;max-width:600px;margin:0 auto 2rem;line-height:1.6}
        .shell-hero-actions{display:flex;gap:1rem;justify-content:center;flex-wrap:wrap}
        .shell-btn-primary{background:#fff;color:#0057b8;padding:14px 28px;border-radius:8px;font-weight:600;font-size:1.05rem;text-decoration:none}
        .shell-btn-secondary{background:transparent;color:#fff;padding:14px 28px;border:2px solid rgba(255,255,255,.8);border-radius:8px;font-weight:600;font-size:1.05rem;text-decoration:none}
        @media (max-width:768px){
            .shell-header-inner{gap:clamp(4px,2vw,12px);padding:.5rem clamp(6px,2vw,16px)}
            .shell-logo{flex:1 1 auto;min-width:0;overflow:hidden}
            .shell-logo-main{font-size:clamp(.95rem,4.5vw,1.5rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
            .shell-logo-sub{font-size:clamp(.55rem,2.3vw,.85rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
            .shell-emergency{padding:clamp(3px,1.2vw,8px) clamp(5px,2vw,16px)}
            .shell-emergency-label{font-size:clamp(.5rem,2vw,.75rem);white-space:nowrap}
            .shell-emergency-number{font-size:clamp(1rem,5vw,1.5rem)}
            .shell-hero h1{font-size:clamp(1.6rem,7vw,2.2rem)}
            .shell-hero{padding-block:2.5rem}
            .shell-hero-sub{font-size:1.05rem}
        }
    </style>
</head>
<body>
    <div id="root">
        <!-- App-shell: виден мгновенно, до загрузки JS. Заменяется React'ом. -->
        <header class="shell-header">
            <div class="shell-header-inner">
                <span class="shell-logo">
                    <span class="shell-logo-main" data-i18n="title">Тараклия-ГАЗ</span>
                    <span class="shell-logo-sub">SRL «Taraclia Gaz»</span>
                </span>
                <a href="tel:904" class="shell-emergency">
                    <span class="shell-emergency-label" data-i18n="emergency">Аварийная служба</span>
                    <span class="shell-emergency-number">904</span>
                </a>
            </div>
        </header>
        <section class="shell-hero">
            <div class="shell-container">
                <h1 data-i18n="title">Тараклия-ГАЗ</h1>
                <p class="shell-hero-sub" data-i18n="subtitle">Надёжное газоснабжение для жителей и предприятий Тараклийского района</p>
                <div class="shell-hero-actions">
                    <a href="tel:904" class="shell-btn-primary" data-i18n="emergency904">Аварийная служба: 904</a>
                    <a href="/contacts" class="shell-btn-secondary" data-i18n="contacts">Контакты</a>
                </div>
            </div>
        </section>
    </div>
    <script>
        // Если пользователь ранее выбрал румынский — сразу показываем каркас на ro
        try {
            if (localStorage.getItem('language') === 'ro') {
                var ro = {
                    title: 'Taraclia-GAZ',
                    emergency: 'Serviciul de urgență',
                    subtitle: 'Alimentare sigură cu gaze naturale pentru locuitorii și întreprinderile raionului Taraclia',
                    emergency904: 'Serviciul de urgență: 904',
                    contacts: 'Contacte'
                };
                document.querySelectorAll('[data-i18n]').forEach(function (el) {
                    var key = el.getAttribute('data-i18n');
                    if (ro[key]) el.textContent = ro[key];
                });
            }
        } catch (e) { /* приватный режим — остаётся русский */ }
    </script>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
